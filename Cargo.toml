[workspace]
members = [
  "crates/codex-turn-status-core",
  "crates/codex-turn-notify",
  "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.2.0"

[workspace.dependencies]
chrono = { version = "0.4.43", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.9.5", features = ["tray-icon"] }
tauri-build = "2.5.3"
thiserror = "2.0.18"
